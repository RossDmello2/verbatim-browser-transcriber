name: Feature Request
description: Suggest a Verbatim feature or improvement.
title: "[FEAT] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow Problem
      description: What user workflow is blocked or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
