name: Feature Request
description: Suggest a Verbatim feature or improvement.
title: "[FEAT] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow Problem
      description: What user workflow is blocked or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Recording
        - Capture
        - File transcription
        - Providers/models
        - Translation
        - Transcript editing
        - Workspace import/export
        - Memory/glossary
        - Assistant
        - Diagnostics
        - Export formats
        - Mobile shell
        - Documentation/tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Optional, but useful for maintainers.
    validations:
      required: false
